<body>
  <app-header></app-header>

  <app-filter
    [filtro]="{ options: ['Respiratorio', 'Quirúrgico', 'No Quirúrgico', 'Diagnóstico', 'Medicina General', 'Oncología Médica'] }"
    (apply)="applyFilter($event)">
  </app-filter>
  <div class="container">
    @for (especialidad of filteredEspecialidades$ | async; track $index) {
      <app-specialty [specialty1]="especialidad"></app-specialty>
    }
  </div>

<app-footer></app-footer>
</body>
