<app-header/>

<main>
  <div class="formulario_cita">

    <div class="texto_cita">
      <h1 id="title"></h1>
    </div>

    <form id="formCita">
      <label for="centro"></label>
      <input id="centro" type="text" placeholder="Lorem ipsum" readonly>

      <label for="especialidad_input"></label>
      <input id="especialidad_input" type="text" placeholder="Lorem ipsum" readonly>

      <label for="dni"></label>
      <input id="dni" type="text" placeholder="Lorem ipsum"
             required
             pattern="\d{8}[A-Z]"
             title="Formato: 12345678A">

      <label for="fecha"></label>
      <select id="fecha" required>
        <option value=""></option>
      </select>

      <label for="hora"></label>
      <select id="hora" required>
        <option value=""></option>
      </select>

      <label for="medico"></label>
      <select id="medico" required>
        <option value=""></option>
      </select>

      <div class="boton">
        <button id="boton_confirmar" type="submit"></button>
      </div>
    </form>
  </div>
</main>
<app-footer/>
