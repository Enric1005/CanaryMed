<app-header/>

<ion-content>
  @if (userLoaded) {
    <div class="content-wrapper">
      <div class="profile-left">
        <div class="profile-card">
          <div class="profile-top">
            <img class="profile-photo" src="assets/Usuario.webp" alt="Foto de perfil">
            <div class="profile-info">
              <h3>{{user.name}}</h3>
              <h4>{{user.DNI}}</h4>
            </div>
          </div>

          <div class="profile-text">
            <p id="texto1">{{user.surname}}</p>
            <div class="divider"></div>
            <p id="texto2">{{user.email}}</p>
            <div class="divider"></div>
            <p id="texto3">{{user.phoneNumber}}</p>
            <div class="divider"></div>
            <p id="texto4">{{user.role}}</p>
            <div class="divider"></div>
          </div>

          <div class="profile-buttons">
            <ion-button [routerLink]="['/register-edit']" fill="solid" color="primary">
              Editar
            </ion-button>
            <ion-button fill="outline" color="medium" (click)="logout()">
              Cerrar SesiÃ³n
            </ion-button>
          </div>
          <hr>
          <ion-button expand="block" id="delete_btn" (click)="deleteMode()">
            Eliminar Cuenta
          </ion-button>
        </div>
      </div>

      <div class="profile-right">
        <div class="profile-sections">
          <!-- En Android los favoritos vienen de SQLite, en web de Firestore -->
          <app-profile-section
            titulo="Favoritos"
            [items]="isAndroid() ? favoritosAndroid : (user.favs ?? [])">
          </app-profile-section>
        </div>
        <div class="profile-sections">
          <app-profile-section titulo="Pendientes" [items]="user.pendientes ?? []"></app-profile-section>
        </div>
        <div class="profile-sections">
          <app-profile-section titulo="Historial" [items]="user.hist ?? []"></app-profile-section>
        </div>
      </div>
    </div>
  } @else {
    <app-loading-spinner/>
  }
</ion-content>
