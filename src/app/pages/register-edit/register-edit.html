<body>
<main>
  <div class="text"><h1>Registrarse</h1></div>

  <div class="contenedor2">
    <div class="text_box">
      <form (submit)="register($event)">
        <label>Nombre</label>
        <input id="nombre" type="text" required>

        <label>Apellidos</label>
        <input id="apellidos" type="text" required>

        <label>Email</label>
        <input id="email" type="email" required>

        <label>Confirmar Email</label>
        <input id="email_confirm" type="email" required>

        <label>Contraseña</label>
        <input id="password" type="password" required>

        <label>Confirmar Contraseña</label>
        <input id="password_confirmed" type="password" required>

        <label>DNI</label>
        <input id="NIF" type="text" required>

        <label>Teléfono</label>
        <input id="tel" type="tel" required>

        <div class="chbox">
          <input type="checkbox" id="mi-check">
          <label>Acepto términos</label>
        </div>

        <div class="boton">
          <button type="submit">Registrarse</button>
        </div>

      </form>

    </div>
  </div>
</main>
</body>
