<body>
<main>
  <div class="login">
    <h1>Inicio Sesión</h1>
    <form id="login_form" (submit)="login($event)">
      <label for="email">Correo</label>
      <input id="email" type="email" name="lorem ipsum" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" name="lorem ipsum2" required>

      <div class="botones">
        <button type="submit">Iniciar Sesión</button>
        <button type="button" (click)="goBack()">Cancelar</button>
      </div>
      <nav>
        <a routerLink="/register-edit">Crear Cuenta</a>
      </nav>
    </form>
  </div>
</main>
</body>
