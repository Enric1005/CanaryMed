<ion-header>
  <app-header/>
</ion-header>

<ion-content>
  @if (centro$ | async; as centro) {
    <div class="text-section2">
      <div class="text-header">
        <h1>{{centro.name}}</h1>
        <ion-button routerLink="/centers">Volver Atrás</ion-button>
      </div>
      <hr>
      <div class="center-image">
        <img [src]="'assets/' + centro.image">
      </div>
      <ion-text><p>{{centro.description}}</p></ion-text>
    </div>

    <div class="text-section2">
      @for (especialidad of centro.specialities; track especialidad.name) {
        <app-specialty-center [data]="especialidad"/>
      }
    </div>
  } @else {
    <app-loading-spinner/>
  }
  <app-footer></app-footer>
</ion-content>
