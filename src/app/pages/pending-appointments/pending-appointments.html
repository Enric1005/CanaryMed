<app-header/>

<ion-content>
  <div class="page-container">

    <main class="text-section3">
      <div class="text-header">
        <h1>{{titulo}}</h1>
        <ion-button type="button" class="section-btn" routerLink="/profile">Volver Atrás</ion-button>
      </div>
      <hr>
    </main>

    <div class="appointments-container">
      @for (item of items ; track item) {
        <app-pending-appointment [item]="item" (delete)="deleteItem($event)" [titulo]="titulo"></app-pending-appointment>
      }
    </div>
  </div>
</ion-content>
