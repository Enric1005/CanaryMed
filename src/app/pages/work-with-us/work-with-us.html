<ion-content>
  <app-header></app-header>

  <app-colabora-base></app-colabora-base>

  @if(loading){
    <div class="no-login">
      <ion-button [disabled] = "true">Cargando...</ion-button>
    </div>
  } @else if(!user || user.role === "Paciente" || (user && user.role !== 'Empresa')){
    <div class="no-login">
      <ion-button (click)="goRegister()">Registrarse como empresa</ion-button>
    </div>
  } @else if(user && user.role === 'Empresa'){
    <div class="formulario">
      <form (ngSubmit)="onSubmit(form)" #form="ngForm">

        <label>*Institución Sanitaria</label>
        <input name="institucion" ngModel required minlength="2" placeholder="Hospital San Roque">

        <label>*Correo Institucional</label>
        <input name="correo" type="email" ngModel required placeholder="institucionEjemplo@gmail.com">

        <label>*Número Telefónico</label>
        <input name="telefono" ngModel required pattern="\d{9}" placeholder="Número de la institución">

        <label>*Dirección</label>
        <input name="direccion" ngModel required minlength="5" placeholder="Calle Diego Betancourt">

        <label>*Tipo de Especialidad</label>
        <select name="tipoEspecialidad" ngModel required>
          <option value="" disabled selected></option>
          <option value="oncología">Oncología Médica</option>
          <option value="quirúrgico">Quirúrgico</option>
          <option value="no_quirúrgico">No Quirúrgico</option>
          <option value="diagnóstico">Diagnóstico</option>
          <option value="medicina_general">Medicina General</option>
          <option value="respiratorio">Respiratorio</option>
          <option value="otro">Otro</option>
        </select>

        <label>*Especialidad</label>
        <input name="especialidad" ngModel required minlength="2" placeholder="Cardiología">

        <div class="boton">
          <ion-button type="submit">Colaborar</ion-button>
        </div>

      </form>
    </div>
  }

  <app-footer></app-footer>
</ion-content>
