<app-header></app-header>

<app-colabora-base></app-colabora-base>
<div class="formulario">
  <form (ngSubmit)="onSubmit(form)" #form="ngForm">
    <label>*Institución Sanitaria</label>
    <input name="institucion" ngModel required minlength="2" placeholder="Perpetuo Socorro">

    <label>*Correo Institucional</label>
    <input name="correo" type="email" ngModel required placeholder="hospital123@gmail.com">

    <label for="telefono">*Número Telefónico</label>
    <input name="telefono" ngModel required pattern="\d{9}" placeholder="Teléfono de la institución">

    <label for="direccion">*Dirección</label>
    <input name="direccion" type="text" ngModel required minlength="5" placeholder="Calle Mayor 12, Las Palmas">

    <label for="tipo">*Tipo de Especialidad</label>
    <select name="tipo" ngModel required>
      <option value="oncología">Oncología Médica</option>
      <option value="quirúrgico">Qirúrgico</option>
      <option value="no_quirúrgico">No Quirúrgico</option>
      <option value="diagnóstico">Diagnóstico</option>
      <option value="medicina_general">Medicina General</option>
      <option value="respiratorio">Respiratorio</option>
      <option value="otro">Otro</option>
    </select>

    <label for="especialidad">*Especialidad</label>
    <input name="especialidad" ngModel required minlength="2" placeholder="Cardiologia">

    <div class="boton"><button type="submit">Colaborar</button></div>
  </form>
</div>

<app-footer></app-footer>
