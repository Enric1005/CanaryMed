<app-header></app-header>

<app-colabora-base></app-colabora-base>

@if(!user$){
<div class="no-login">
  <button (click)="goRegister()">Registrarse como empresa</button>
</div>
}

@if(user$){
<div class="formulario">
  <form (ngSubmit)="onSubmit(form)" #form="ngForm">
    <label>*Institución Sanitaria</label>
    <input name="institucion" ngModel required minlength="2">

    <label>*Correo Institucional</label>
    <input name="correo" type="email" ngModel required>

    <label>*Número Telefónico</label>
    <input name="telefono" ngModel required pattern="\d{9}">

    <label>*Dirección</label>
    <input name="direccion" ngModel required minlength="5">

    <label>*Tipo de Especialidad</label>
    <select name="tipoEspecialidad" ngModel required>
      <option value="" disabled selected></option>
      <option value="oncología">Oncología Médica</option>
      <option value="quirúrgico">Quirúrgico</option>
      <option value="no_quirúrgico">No Quirúrgico</option>
      <option value="diagnóstico">Diagnóstico</option>
      <option value="medicina_general">Medicina General</option>
      <option value="respiratorio">Respiratorio</option>
      <option value="otro">Otro</option>
    </select>

    <label>*Especialidad</label>
    <input name="especialidad" ngModel required minlength="2">

    <div class="boton">
      <button type="submit">Colaborar</button>
    </div>
  </form>
</div>
}
<app-footer></app-footer>
