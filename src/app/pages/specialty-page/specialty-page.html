<app-header/>

<ion-content>
  @if (datos$ | async; as datos) {
    <main class="text-section4">
      <div class="text-header">
        <h1>{{ datos.name }}</h1>
        <ion-button class="section-btn" routerLink="/specialtys">Volver atrás</ion-button>
      </div>
      <hr>
      <ion-text><p>{{ datos.description }}</p></ion-text>
    </main>

    <main id="centers_container">
      @if (origen === 'centro') {
        @for (item of datos.specialities; track item.name) {
          <app-specialty-center [data]="item"/>
        }
      } @else {
        @for (item of datos.centers; track item.name) {
          <app-specialty-center [data]="item"/>
        }
      }
    </main>
  } @else {
    <app-loading-spinner/>
  }

  <app-footer/>
</ion-content>
