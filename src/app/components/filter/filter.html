<main>
  <input type="checkbox" id="toggle_filters" hidden>
  <label for="toggle_filters" class="filter_toggle">Filtros</label>

  <div class="filter_zone">
    <div class="filter_zone2">
      <input type="button" value="Filtrar" class="filter_zone_input" (click)="applyFilters()">
      @for (option of filtro.options; track option) {
        <label>
          <input type="checkbox" (change)="onChange(option, $event)">
          {{option}}
        </label>
      }
    </div>
  </div>
</main>
