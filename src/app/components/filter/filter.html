<div class="filter-container" [class.small]="size === 'small'" [class.large]="size === 'large'">
  <div class="filter-header">
    <ion-label>Filtros</ion-label>
  </div>
  <div class="filter-options">
    @for (option of filtro.options; track option) {
      <div class="filter-option">
        <ion-checkbox (click)="onChange(option, $event)">{{option}}</ion-checkbox>
      </div>
    }
    <ion-button class="filter-button" (click)="applyFilters()">Filtrar</ion-button>
  </div>
</div>
