
  <ion-card class="center-section">
    <ion-card-content class="center-content">

      <div class="favorite">
        <input
          type="checkbox"
          [id]="'fav-' + center.id"
          [checked]="center.isFavorite"
          (click)="handleFavoriteClick($event, center)">
        <label [for]="'fav-' + center.id"></label>
      </div>

      <div class="center-image">
        <img
          class="center"
          [src]="'assets/' + center.image"
          [alt]="center.name">
      </div>

      <div class="center-text">
        <ion-card-title>{{ center.name }}</ion-card-title>
        <ion-card-subtitle>{{ center.precio }}</ion-card-subtitle>
        <ion-text>
          <p>{{ center.description }}</p>
        </ion-text>
      </div>

      <ion-button
        class="center-button"
        (click)="seleccionarCentro(center)"
        [routerLink]="['/center_page', center.id]">
        Ver centros
      </ion-button>

    </ion-card-content>
  </ion-card>

  <ion-modal [isOpen]="showLoginPopup" (didDismiss)="showLoginPopup = false">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Inicia sesión</ion-title>
        </ion-toolbar>
      </ion-header>


        <div class="ion-padding">
          <p>Debes registrarte o iniciar sesión para poder añadir centros a favoritos.</p>

          <div class="popup-buttons">
            <ion-button expand="block" (click)="goToLogin()">
              Ir al login
            </ion-button>

            <ion-button
              expand="block"
              fill="outline"
              (click)="showLoginPopup = false">
              Cancelar
            </ion-button>
          </div>
        </div>
    </ng-template>
  </ion-modal>
