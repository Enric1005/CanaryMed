<ion-card>
  <ion-card-header>
    <ion-card-title>{{titulo}}</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-list>
      @for(item of items.slice(0, 3); track item) {
        <ion-item>
          <ion-label>{{item}}</ion-label>
        </ion-item>
      }
    </ion-list>
  </ion-card-content>
  <ion-item button lines="none" (click)="verMas()">
    <ion-label color="primary">Ver más</ion-label>
  </ion-item>
</ion-card>
