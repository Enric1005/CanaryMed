<ion-card class="specialty_center-section">

  <ion-card-content class="specialty_center-content">

    <!-- imagen -->
    <div class="specialty_center-image">
      <img
        [src]="data?.src ? 'assets/' + data.src : 'assets/' + data?.image"
        alt="Imagen">
    </div>

    <!-- texto -->
    <div class="specialty_center-text">

      <ion-card-title>
        {{ data?.name }}
      </ion-card-title>

      <ion-card-subtitle>
        💰 {{ data?.price }}
      </ion-card-subtitle>

      <ion-text>
        <p class="location">🩺 {{ data?.location }}</p>
      </ion-text>

      <ion-text>
        <p class="doctor">👨‍⚕️ {{ doctorName }}</p>
      </ion-text>

    </div>

    <!-- botón -->
    <ion-button
      type="button"
      class="specialty_center-button"
      (click)="reservar()">

      Reservar

    </ion-button>

  </ion-card-content>

</ion-card>

<ion-modal
  [isOpen]="showLoginPopup"
  (didDismiss)="showLoginPopup = false">

  <ng-template>

    <ion-header>
      <ion-toolbar>
        <ion-title>Inicia sesión</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>

      <div class="ion-padding">

        <p>
          Debes registrarte o iniciar sesión para poder reservar una cita.
        </p>

        <div class="popup-buttons">

          <ion-button
            expand="block"
            (click)="goToLogin()">

            Ir al login

          </ion-button>

          <ion-button
            expand="block"
            fill="outline"
            (click)="showLoginPopup = false">

            Cancelar

          </ion-button>

        </div>

      </div>

    </ion-content>

  </ng-template>

</ion-modal>
