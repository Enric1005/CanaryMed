<main>
  <div class="specialty_center-section">

    <div class="specialty_center-content">

      <!-- imagen -->
      <div class="specialty_center-image">
        <img
          [src]="data.src ? 'assets/' + data.src : 'assets/' + data.image"
          class="specialty_center">
      </div>

      <!-- texto -->
      <div class="specialty_center-text">

        <h1>{{ data?.name }}</h1>

        <p data-type="price">
          💰 {{ data?.price }}
        </p>

        <p data-type="location">
          📍 {{ data?.location }}
        </p>

        <p data-type="doctor">
          👨‍⚕️
          {{
            Array.isArray(data.doctor)
              ? data.doctor.join(', ')
              : data.doctor
          }}
        </p>

      </div>

      <!-- botón -->
      <a href="#">
        <button type="button" id="spc_btn" class="specialty_center-button">
          Reservar
        </button>
      </a>

    </div>

  </div>
</main>
