<ion-header>
  <ion-toolbar>

    <!-- primera línea -->
    <div class="first_line">

      <ion-menu-button class="menu-toggle" (click)="toggleMenu()">☰</ion-menu-button>

      <a class="name_of_company" [routerLink]="['/']">
        <h1>CanaryMed</h1>
      </a>

      <div class="center_group">
        <ion-searchbar
          class="search-bar"
          placeholder="Busca Centro/Especialidad"
          [(ngModel)]="searchText"
          (ionInput)="onSearch()">
        </ion-searchbar>

        @if (resultados.length > 0) {
          <ion-list class="results">
            @for (item of resultados; track item.id) {
              <ion-item [button]="true" (click)="selectItem(item)">
                {{ item.name }}
              </ion-item>
            }
          </ion-list>
        }

        <ion-button class="filter-btn" (click)="buscar()">Buscar</ion-button>
      </div>

      <!-- usuario -->
      <button class="btn_user" (click)="goToProfile()">
        @if (!isLoggedIn) {
          <img class="usuario" src="assets/Usuario.webp"/>
        } @else {
          <img class="usuario" src="assets/icono_check.png"/>
        }
      </button>

    </div>

    <!-- menú -->
    <div class="second_line">
      <ul [class.show]="menuAbierto">
        <li><a routerLink="/centers">Centros</a></li>
        <li><a routerLink="/specialtys">Especialidades</a></li>
        <li><a routerLink="/work-with-us">Trabaja con nosotros</a></li>
        <li><a routerLink="/about-us">Sobre nosotros</a></li>
      </ul>
    </div>

    <div class="menu-overlay" [class.show]="menuAbierto" (click)="toggleMenu()"></div>

  </ion-toolbar>
</ion-header>
