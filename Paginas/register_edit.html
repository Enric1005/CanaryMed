<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanaryMed</title>


    <link rel="stylesheet" href="../CSS/register_edit.css">
</head>
<body>
<main>
        <div class="text"><h1>Lorem ipsum</h1></div>
        <div class="contenedor2">
            <div class="text_box">
                <form id="register_form">
                    <label for="nombre"></label>
                    <input type="text" name="lor1" id="nombre" placeholder="" required>

                    <label for="apellidos"></label>
                    <input type="text" name="lor2" id="apellidos" placeholder="" required>

                    <label for="email"></label>
                    <input type="email" name="lor3" id="email" placeholder="" required>

                    <label for="email_confirm"></label>
                    <input type="email" name="lor4" id="email_confirm" placeholder="" required>

                    <label for="password"></label>
                    <input type="password" id="password" placeholder="" required
                           pattern="(?=.*[A-Za-z])(?=.*[^A-Za-z0-9]).{8,}"
                           title="Mínimo 8 caracteres, una letra y un carácter especial">

                    <label for="password_confirmed"></label>
                    <input type="password" name="lor6" id="password_confirmed" placeholder="" required>

                    <label for="NIF"></label>
                    <input type="text" id="NIF" placeholder="lorem ipsum" required
                           pattern="\d{8}[A-Z]" title="Formato: 12345678A">

                    <label for="tel"></label>
                    <input type="tel" id="tel" placeholder="lorem ipsum" required
                           pattern="\d{9}" title="9 dígitos">
                    <div class="chbox">
                        <input type="checkbox" class="check" id="mi-check">
                        <label for="mi-check">Lorem ipsum dolor</label>
                    </div>

                    <div class="boton"> <input type="submit" value="Lorem ipsum" class="button">  </div>
                </form>
            </div>
        </div>
    </main>
<script type="module" src="../JS/data.js"></script>
</body>
</html>
