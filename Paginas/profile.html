<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanaryMed - Profile</title>

    <script src="../JS/xlu-include-file.js"></script>
    <link rel="stylesheet" href="../CSS/header.css">

</head>
<body>

<div id="main_header" xlu-include-file="../Templates/header.html"></div>

<div class="content-wrapper">

    <!-- COLUMNA IZQUIERDA: Perfil -->

                    <h3>Lorem ipsum</h3>

            </div>

            <!-- Texto adicional -->
            <div class="profile-text">
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                <div class="divider"></div>
                <p>Phasellus imperdiet, nulla et dictum interdum, nisi lorem.</p>
                <div class="divider"></div>
                <p>Maecenas malesuada, quam in varius tincidunt, justo.</p>
                <div class="divider"></div>
            </div>

            <!-- Botones al final -->
            <div class="profile-buttons">
                <button type="button">Lorem ipsum</button>
                <button type="button">Lorem ipsum</button>
            </div>

        </div>
    </div>

    <!-- COLUMNA DERECHA: Secciones -->
    <div class="profile-right">
        <div class="profile-sections">
            <div id="profile_section1" xlu-include-file="../Templates/profile_section.html"></div>
            <div id="profile_section2" xlu-include-file="../Templates/profile_section.html"></div>
            <div id="profile_section3" xlu-include-file="../Templates/profile_section.html"></div>

<script>
xLuIncludeFile();
</script>
