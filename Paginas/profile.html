<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanaryMed - Profile</title>

    <link rel="stylesheet" href="../CSS/header.css">

    <link rel="stylesheet" href="../CSS/profile.css">
    <link rel="stylesheet" href="../CSS/profile_section.css">
</head>
<body>

<div id="main_header" xlu-include-file="../Templates/header.html"></div>

<div class="content-wrapper">

    <div class="profile-left">
        <div class="section profile-card">
            <div class="profile-top">
                <img src="../Assets/Usuario.webp" alt="Foto de perfil" class="profile-photo">
                <div class="profile-info">
                    <h3></h3>
                    <h4></h4>
                </div>
            </div>

            <div class="profile-text">
                <p id="texto1"></p>
                <div class="divider"></div>
                <p id="texto2"></p>
                <div class="divider"></div>
                <p id="texto3"></p>
                <div class="divider"></div>
            </div>

            <div class="profile-buttons">
                <button onclick="window.location.href='../Paginas/register_edit.html'" id="btn_esp"></button>
                <button id="log_out_btn"></button>
            </div>

        </div>
    </div>

    <div class="profile-right">
        <div class="profile-sections">
            <div id="profile_section1" data-type="pending" xlu-include-file="../Templates/profile_section.html"></div>
            <div id="profile_section2" data-type="record" xlu-include-file="../Templates/profile_section.html"></div>
            <div id="profile_section3" data-type="favorites" xlu-include-file="../Templates/profile_section.html"></div>
        </div>
    </div>

</div>
<script type="module" src="../JS/data.js"></script>
</body>
</html>
