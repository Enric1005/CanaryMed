<ion-header>
  <app-header/>
</ion-header>

<ion-content>
  @if (datos$ | async; as datos) {
    <div class="text-section4">
      <div class="text-header">
        <h1>{{ datos.name }}</h1>
        <ion-button routerLink="/specialtys">Volver atrás</ion-button>
      </div>
      <hr>
      <ion-text><p>{{ datos.description }}</p></ion-text>
    </div>

    <div id="centers_container">
      @if (origen === 'centro') {
        @for (item of datos.specialities; track item.name) {
          <app-specialty-center [data]="item"/>
        }
      } @else {
        @for (item of datos.centers; track item.name) {
          <app-specialty-center [data]="item"/>
        }
      }
    </div>
  } @else {
    <app-loading-spinner/>
  }
</ion-content>

<ion-footer>
  <app-footer/>
</ion-footer>
