<ion-content>
  <div class="login">
    <h1>Inicio Sesión</h1>
    <form id="login_form" (submit)="login($event)">
      <ion-item>
        <ion-label position="stacked">Correo</ion-label>
        <ion-input id="email" type="email" name="email" required></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input id="password" type="password" name="password" required></ion-input>
      </ion-item>

      <div class="botones">
        <ion-button type="submit">Iniciar Sesión</ion-button>
        <ion-button type="button" fill="outline" (click)="goBack()">Cancelar</ion-button>
      </div>

      <div class="nav-link">
        <a routerLink="/register-edit">Crear Cuenta</a>
      </div>
    </form>
  </div>
</ion-content>
