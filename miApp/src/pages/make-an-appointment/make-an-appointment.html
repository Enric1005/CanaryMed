<app-header/>

<main>
  <div class="appointment_block">

    <div class="texto_cita">
      <h1 id="title">Haz una cita</h1>
    </div>

    <form id="formCita">

      <label for="centro">Centro</label>
      <input id="centro" name="centro" type="text" [value]="centroCampo" readonly>

      <label for="especialidad_input">Especialidad</label>
      <input id="especialidad_input" name="especialidad" type="text" [value]="especialidadCampo" readonly>

      <label for="dni">DNI</label>
      <input id="dni" name="dni" type="text"
             placeholder="12345678A"
             required
             pattern="\d{8}[A-Z]"
             title="Formato: 12345678A">

      <!-- MÉDICO -->
      <label for="medico">Médico</label>
      <select id="medico"
              [(ngModel)]="medicoSeleccionadoIndex"
              (ngModelChange)="onMedicoChange()"
              name="medico"
              required>
        <option [ngValue]="''">Selecciona un médico</option>
        <option *ngFor="let m of medicos; let i = index" [ngValue]="i">
          {{ m.name }}
        </option>
      </select>

      <!-- FECHA -->
      <label for="fecha">Fecha</label>
      <select id="fecha"
              [(ngModel)]="fechaSeleccionada"
              (ngModelChange)="onFechaChange()"
              name="fecha"
              [disabled]="!medicoSeleccionado"
              required>
        <option value="">Selecciona una fecha</option>
        <option *ngFor="let f of fechas" [value]="f">
          {{ f }}
        </option>
      </select>

      <!-- HORA -->
      <label for="hora">Hora</label>
      <select id="hora"
              [(ngModel)]="horaSeleccionada"
              name="hora"
              [disabled]="!fechaSeleccionada"
              required>
        <option value="">Selecciona una hora</option>
        <option *ngFor="let h of horas" [value]="h">
          {{ h }}
        </option>
      </select>

      <div class="boton">
        <button id="boton_confirmar" type="button" (click)="confirmarCita()">
          Confirmar cita
        </button>
      </div>

    </form>
  </div>
</main>

<app-footer/>
